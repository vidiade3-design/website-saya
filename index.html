<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investasi Emas</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f5;
    color:#333;
}

/* Navbar */
nav{
    background:#0d47a1;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 8%;
    position:sticky;
    top:0;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#FFD700;
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

nav ul li a:hover{
    color:#FFD700;
}

/* Hero */
.hero{
    height:90vh;
    background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
    url("https://images.unsplash.com/photo-1610375461246-83df859d849d?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    padding:20px;
}

.hero h1{
    font-size:56px;
    margin-bottom:20px;
}

.hero p{
    font-size:22px;
    margin-bottom:35px;
}

.btn{
    display:inline-block;
    background:#FFD700;
    color:#000;
    padding:15px 35px;
    border-radius:50px;
    text-decoration:none;
    font-weight:bold;
    margin:10px;
}

.btn2{
    background:white;
    color:#0d47a1;
}

.btn:hover{
    opacity:.9;
}

@media(max-width:768px){

nav{
    flex-direction:column;
}

nav ul{
    margin-top:15px;
    flex-wrap:wrap;
    justify-content:center;
}

.hero h1{
    font-size:36px;
}

.hero p{
    font-size:18px;
}

}
</style>

</head>
<body>

<nav>

<div class="logo">
EMASKU
</div>

<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Produk</a></li>
<li><a href="#">Harga</a></li>
<li><a href="#">Tentang</a></li>
<li><a href="#">Kontak</a></li>
</ul>

</nav>

<section class="hero">

<div>

<h1>Investasi Emas Lebih Mudah</h1>

<p>
Mulai investasi emas dengan aman, terpercaya, dan transparan.
</p>

<a href="#" class="btn">Lihat Produk</a>

<a href="#" class="btn btn2">Hubungi Kami</a>

</div>

</section>

</body>
</html>
